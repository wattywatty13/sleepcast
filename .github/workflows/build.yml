name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SleepCast-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SleepCast.apk
          gh release create "build-${{ github.run_number }}" SleepCast.apk \
            --title "SleepCast build ${{ github.run_number }}" \
            --notes "Download SleepCast.apk below and open it on your phone to install." \
            --target "${{ github.sha }}" --latest
